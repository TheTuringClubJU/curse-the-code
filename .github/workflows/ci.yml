name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ctc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/ctc_test
      CONTENT_FILE: content.test.json
      ASSETS_DIR: assets_test
      ANSWER_PEPPER: test-pepper-not-secret
      JWT_SECRET: test-jwt-secret-ci
      ADMIN_KEY: test-admin-key
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Guard against real content in repo
        run: |
          if [ -f content.real.json ] || [ -d assets_real ]; then
            echo "Real content must never be committed"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database schema
        run: psql "$DATABASE_URL" -f schema.sql

      - name: Run backend tests
        run: python -m pytest --cov=app --cov-report=term-missing

  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build