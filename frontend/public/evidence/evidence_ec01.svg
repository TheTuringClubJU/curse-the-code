<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
    <defs>
        <radialGradient id="paperV" cx="50%" cy="50%" r="70%">
            <stop offset="60%" stop-color="#e8f0ea"/>
            <stop offset="100%" stop-color="#b8ccbc"/>
        </radialGradient>
    </defs>
    <rect width="580" height="440" fill="url(#paperV)" rx="5"/>
    <rect width="564" height="424" x="8" y="8" fill="none" stroke="#4a7a52" stroke-width="1.5" opacity="0.4" rx="4"/>

    <!-- Header -->
    <text x="60" y="52" font-family="Courier, monospace" font-size="14" font-weight="bold" letter-spacing="2" fill="#1a3d20">TRANSMISSION LOG — CHANNEL 7</text>
    <text x="60" y="72" font-family="Courier, monospace" font-size="10" letter-spacing="1" fill="#4a7a52">RADIO INTERCEPT DIVISION // FREQ MONITORING UNIT</text>
    <line x1="60" y1="88" x2="520" y2="88" stroke="#4a7a52" stroke-width="1.2" opacity="0.5"/>

    <!-- Body -->
    <text x="60" y="125" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2a5a30">DATE / TIME:</text>
    <text x="210" y="125" font-family="Courier, monospace" font-size="12" fill="#1a3d20">14 AUG 1983  |  23:41 hrs</text>
    <text x="60" y="150" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2a5a30">ORIGINATING NODE:</text>
    <text x="210" y="150" font-family="Courier, monospace" font-size="12" fill="#1a3d20">DELTA CONTROL</text>
    <text x="60" y="175" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2a5a30">DESTINATION:</text>
    <text x="210" y="175" font-family="Courier, monospace" font-size="12" fill="#1a3d20">EXTERNAL — FREQUENCY 7.455 MHz</text>
    <text x="60" y="200" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2a5a30">RECIPIENT:</text>
    <text x="210" y="200" font-family="Courier, monospace" font-size="12" fill="#1a3d20">UNREGISTERED</text>
    <text x="60" y="225" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2a5a30">DURATION:</text>
    <text x="210" y="225" font-family="Courier, monospace" font-size="12" fill="#1a3d20">4 min 12 sec</text>
    <text x="60" y="250" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2a5a30">CONTENT SUMMARY:</text>
    <text x="210" y="250" font-family="Courier, monospace" font-size="12" fill="#a31818" font-weight="bold">[WITHHELD — BY ORDER OF M. CORVIN]</text>
    <text x="60" y="275" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2a5a30">LOGGED BY:</text>
    <text x="210" y="275" font-family="Courier, monospace" font-size="12" fill="#1a3d20">DUTY OPERATOR (signature illegible)</text>

    <!-- Stamp -->
    <g transform="translate(370, 46) rotate(10)">
        <rect x="0" y="0" width="150" height="38" fill="none" stroke="#a31818" stroke-width="2" stroke-dasharray="4 2" rx="3" opacity="0.85"/>
        <text x="75" y="24" font-family="Courier, monospace" font-size="10" font-weight="900" fill="#a31818" text-anchor="middle" letter-spacing="1">RECORD RESTRICTED</text>
    </g>

    <!-- Footer -->
    <line x1="60" y1="385" x2="520" y2="385" stroke="#4a7a52" stroke-width="0.8" opacity="0.4"/>
    <text x="60" y="405" font-family="Courier, monospace" font-size="10" fill="#4a7a52">RECORD ID: EC01 — RELAY RACK FRAGMENT A</text>
    <text x="520" y="405" font-family="Courier, monospace" font-size="9" fill="#6a9a72" text-anchor="end">SUBSTATION DELTA // CTRL-05</text>
</svg>