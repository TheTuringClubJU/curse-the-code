<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
    <defs>
        <radialGradient id="paperV" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#f5f0e8"/><stop offset="100%" stop-color="#d2c8b0"/></radialGradient>
    </defs>
    <rect width="580" height="440" fill="url(#paperV)" rx="5"/>
    <rect width="564" height="424" x="8" y="8" fill="none" stroke="#877556" stroke-width="1.5" opacity="0.4" rx="4"/>
    <!-- Clipboard top bar -->
    <rect x="220" y="4" width="140" height="22" rx="10" fill="#6a5a3a" opacity="0.8"/>
    <rect x="276" y="1" width="28" height="12" rx="4" fill="#4a3a24"/>

    <!-- Header -->
    <text x="60" y="58" font-family="Courier, monospace" font-size="13" font-weight="bold" letter-spacing="2" fill="#2b2319">SHIFT HANDOVER NOTE — NIGHT, 14 AUG</text>
    <text x="60" y="78" font-family="Courier, monospace" font-size="11" font-style="italic" fill="#75644c">To: Incoming operator (you know who you are)</text>
    <line x1="60" y1="92" x2="520" y2="92" stroke="#75644c" stroke-width="1.2" opacity="0.5"/>

    <!-- Body -->
    <text x="60" y="130" font-family="Georgia, serif" font-size="13" fill="#1a1206">"Do not acknowledge any signal from Delta on Channel 7."</text>
    <text x="60" y="160" font-family="Georgia, serif" font-size="13" fill="#1a1206">"Dr C has authorised a full communications blackout."</text>
    <text x="60" y="195" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#a31818">"Nothing gets logged after 23:00. Nothing."</text>
    <text x="60" y="235" font-family="Georgia, serif" font-size="13" fill="#1a1206">"If the board asks: you weren't here."</text>
    <text x="60" y="270" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#a31818">"If it makes a sound in Chamber 3: you heard nothing."</text>

    <!-- Signoff -->
    <text x="360" y="325" font-family="Georgia, serif" font-size="13" fill="#5a4a30" font-style="italic">— Outgoing operator</text>

    <!-- Footer -->
    <line x1="60" y1="385" x2="520" y2="385" stroke="#75644c" stroke-width="0.8" opacity="0.4"/>
    <text x="60" y="405" font-family="Courier, monospace" font-size="10" fill="#75644c">RECORD ID: EC07 — SHIFT HANDOVER NOTE</text>
    <text x="520" y="405" font-family="Courier, monospace" font-size="9" fill="#998369" text-anchor="end">SUBSTATION DELTA // CTRL-05</text>
</svg>