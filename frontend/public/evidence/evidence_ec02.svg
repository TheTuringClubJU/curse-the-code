<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
    <defs>
        <radialGradient id="paperV" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#ede8e0"/><stop offset="100%" stop-color="#c8bfaa"/></radialGradient>
    </defs>
    <rect width="580" height="440" fill="url(#paperV)" rx="5"/>
    <rect width="564" height="424" x="8" y="8" fill="none" stroke="#6a7a5a" stroke-width="1.5" opacity="0.4" rx="4"/>

    <!-- Header -->
    <text x="60" y="52" font-family="Courier, monospace" font-size="13" font-weight="bold" letter-spacing="2" fill="#2b2d1a">EQUIPMENT REQUISITION — DELTA CONTROL</text>
    <text x="60" y="70" font-family="Courier, monospace" font-size="10" letter-spacing="1" fill="#5a6a4a">COMMUNICATIONS EQUIPMENT DIVISION // FORM EQ-83</text>
    <line x1="60" y1="85" x2="520" y2="85" stroke="#5a6a4a" stroke-width="1.2" opacity="0.5"/>

    <!-- Form -->
    <text x="60" y="120" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#5a6a4a">DATE:</text>
    <text x="210" y="120" font-family="Courier, monospace" font-size="12" fill="#2b2d1a">20 SEP 1983</text>
    <text x="60" y="145" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#5a6a4a">REQUESTED BY:</text>
    <text x="210" y="145" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#1b2d1a">CORVIN, M. (BDG-0388)</text>
    <text x="60" y="170" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#5a6a4a">ITEM 1:</text>
    <text x="210" y="170" font-family="Courier, monospace" font-size="12" fill="#2b2d1a">Long-range radio repeater, model RX-440 x2</text>
    <text x="60" y="195" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#5a6a4a">ITEM 2:</text>
    <text x="210" y="195" font-family="Courier, monospace" font-size="12" fill="#2b2d1a">Coaxial cabling, 30m spools x6</text>
    <text x="60" y="220" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#5a6a4a">PURPOSE STATED:</text>
    <text x="210" y="220" font-family="Courier, monospace" font-size="12" fill="#2b2d1a">Routine maintenance</text>
    <text x="60" y="245" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#5a6a4a">APPROVAL:</text>
    <text x="210" y="245" font-family="Courier, monospace" font-size="12" fill="#2b2d1a">SELF-AUTHORISED</text>

    <!-- Annotation note -->
    <rect x="60" y="275" width="460" height="50" fill="#2b2d1a" opacity="0.06" rx="3"/>
    <text x="75" y="295" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#a31818">AUDIT NOTE: Facility officially closed 14 AUG 1983.</text>
    <text x="75" y="313" font-family="Courier, monospace" font-size="10" fill="#5a6a4a">Requisition filed 5 weeks post-shutdown using personal credentials.</text>

    <!-- Stamp -->
    <g transform="translate(370, 48) rotate(8)">
        <rect x="0" y="0" width="145" height="38" fill="none" stroke="#a31818" stroke-width="2" stroke-dasharray="4 2" rx="3" opacity="0.85"/>
        <text x="72" y="24" font-family="Courier, monospace" font-size="10" font-weight="900" fill="#a31818" text-anchor="middle" letter-spacing="1">SELF-AUTHORISED</text>
    </g>

    <!-- Footer -->
    <line x1="60" y1="385" x2="520" y2="385" stroke="#5a6a4a" stroke-width="0.8" opacity="0.4"/>
    <text x="60" y="405" font-family="Courier, monospace" font-size="10" fill="#5a6a4a">RECORD ID: EC02 — RELAY RACK FRAGMENT B</text>
    <text x="520" y="405" font-family="Courier, monospace" font-size="9" fill="#7a8a6a" text-anchor="end">SUBSTATION DELTA // CTRL-05</text>
</svg>