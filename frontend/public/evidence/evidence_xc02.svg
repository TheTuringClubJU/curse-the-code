<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
    <defs>
        <radialGradient id="paperV" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#f2eada"/><stop offset="100%" stop-color="#cfbe9b"/></radialGradient>
    </defs>
    <rect width="580" height="440" fill="url(#paperV)" rx="5"/>
    <rect width="564" height="424" x="8" y="8" fill="none" stroke="#877556" stroke-width="1.5" opacity="0.4" rx="4"/>

    <!-- DECOY stamp -->
    <g transform="translate(100, 60) rotate(-12)">
        <rect x="0" y="0" width="380" height="80" fill="none" stroke="#888" stroke-width="4" stroke-dasharray="8 4" rx="6" opacity="0.4"/>
        <text x="190" y="52" font-family="Courier, monospace" font-size="38" font-weight="900" fill="#aaa" text-anchor="middle" letter-spacing="4" opacity="0.35">DECOY DOCUMENT</text>
    </g>

    <!-- Header -->
    <text x="60" y="58" font-family="Courier, monospace" font-size="13" font-weight="bold" letter-spacing="2" fill="#2b2319">MAINTENANCE LOG — GENERATOR UNIT B</text>
    <text x="60" y="76" font-family="Courier, monospace" font-size="10" letter-spacing="1" fill="#75644c">FACILITIES MANAGEMENT // DELTA CONTROL SUBSTATION</text>
    <line x1="60" y1="90" x2="520" y2="90" stroke="#75644c" stroke-width="1.2" opacity="0.5"/>

    <!-- Mundane content -->
    <text x="60" y="168" font-family="Courier, monospace" font-size="12" fill="#75644c">SERVICE DATE: 02 AUG 1983</text>
    <text x="60" y="190" font-family="Courier, monospace" font-size="12" fill="#75644c">TECHNICIAN: BDG-7721 (Hall, D.)</text>
    <text x="60" y="212" font-family="Courier, monospace" font-size="12" fill="#75644c">TASK: Replace coolant filters — generator unit B</text>
    <text x="60" y="234" font-family="Courier, monospace" font-size="12" fill="#75644c">STATUS: COMPLETE — no anomalies detected</text>
    <text x="60" y="256" font-family="Courier, monospace" font-size="12" fill="#75644c">FUEL LEVEL: 73% — sufficient for 14-day standby</text>
    <text x="60" y="278" font-family="Courier, monospace" font-size="12" fill="#75644c">NEXT SERVICE: 02 SEP 1983 (facility closed by then)</text>

    <text x="60" y="318" font-family="Courier, monospace" font-size="11" fill="#aaa" font-style="italic">Routine maintenance log — no investigative value.</text>

    <!-- Footer -->
    <line x1="60" y1="385" x2="520" y2="385" stroke="#75644c" stroke-width="0.8" opacity="0.4"/>
    <text x="60" y="405" font-family="Courier, monospace" font-size="10" fill="#75644c">RECORD ID: XC02 — DECOY / NON-EVIDENCE</text>
    <text x="520" y="405" font-family="Courier, monospace" font-size="9" fill="#998369" text-anchor="end">SUBSTATION DELTA // CTRL-04</text>
</svg>

