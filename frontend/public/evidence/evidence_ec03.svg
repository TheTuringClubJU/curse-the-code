<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
    <defs>
        <radialGradient id="paperV" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#f2ece0"/><stop offset="100%" stop-color="#cfc3ab"/></radialGradient>
    </defs>
    <rect width="580" height="440" fill="url(#paperV)" rx="5"/>
    <rect width="564" height="424" x="8" y="8" fill="none" stroke="#6a5a30" stroke-width="1.5" opacity="0.4" rx="4"/>

    <!-- Header -->
    <text x="60" y="52" font-family="Courier, monospace" font-size="13" font-weight="bold" letter-spacing="2" fill="#2b2314">MAINTENANCE REPORT — DELTA CONTROL</text>
    <text x="60" y="70" font-family="Courier, monospace" font-size="10" letter-spacing="1" fill="#6a5a30">SURVEILLANCE &amp; MONITORING DIVISION // FORM MR-83</text>
    <line x1="60" y1="85" x2="520" y2="85" stroke="#6a5a30" stroke-width="1.2" opacity="0.5"/>

    <!-- Form -->
    <text x="60" y="115" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6a5a30">DATE:</text>
    <text x="210" y="115" font-family="Courier, monospace" font-size="12" fill="#2b2314">07 NOV 1983</text>
    <text x="60" y="140" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6a5a30">REPORTED FAULT:</text>
    <text x="210" y="140" font-family="Courier, monospace" font-size="12" fill="#2b2314">Monitor bank, units 4–6</text>
    <text x="60" y="165" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6a5a30">FAULT DESCRIPTION:</text>
    <text x="210" y="165" font-family="Courier, monospace" font-size="12" fill="#2b2314">Continuous loop feed from Chamber 3.</text>
    <text x="60" y="190" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6a5a30">FEED CONTENT:</text>
    <text x="210" y="190" font-family="Courier, monospace" font-size="12" fill="#2b2314">Corridor footage, no visible movement.</text>
    <text x="60" y="215" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6a5a30">FEED ORIGIN:</text>
    <text x="210" y="215" font-family="Courier, monospace" font-size="12" fill="#2b2314">Unknown — not matching active camera ID.</text>
    <text x="60" y="240" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#6a5a30">ACTION TAKEN:</text>
    <text x="210" y="240" font-family="Courier, monospace" font-size="12" fill="#2b2314">NONE</text>

    <!-- Handwritten supervisor note -->
    <rect x="60" y="275" width="460" height="55" fill="#a31818" opacity="0.07" rx="3"/>
    <text x="75" y="298" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#a31818">Note appended by supervisor:</text>
    <text x="75" y="318" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#a31818">"DO NOT DISCONNECT — per Dr C"</text>

    <!-- Footer -->
    <line x1="60" y1="385" x2="520" y2="385" stroke="#6a5a30" stroke-width="0.8" opacity="0.4"/>
    <text x="60" y="405" font-family="Courier, monospace" font-size="10" fill="#6a5a30">RECORD ID: EC03 — MONITOR BANK MAINTENANCE LOG</text>
    <text x="520" y="405" font-family="Courier, monospace" font-size="9" fill="#8a7a50" text-anchor="end">SUBSTATION DELTA // CTRL-05</text>
</svg>