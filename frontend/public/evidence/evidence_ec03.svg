    <text x="60" y="196" font-family="Courier, monospace" font-size="11" fill="#2b2314">CART REF:</text><text x="175" y="196" font-family="Courier, monospace" font-size="11" fill="#1a1810">TAPE-DECK-CART-01</text>
    <text x="60" y="216" font-family="Courier, monospace" font-size="11" fill="#2b2314">CONTENTS:</text><text x="175" y="216" font-family="Courier, monospace" font-size="11" fill="#1a1810">VOICEMAIL REELS — VM-A, VM-B, VM-C (mislabelled)</text>
    <text x="60" y="236" font-family="Courier, monospace" font-size="11" fill="#2b2314">LOCATION:</text><text x="175" y="236" font-family="Courier, monospace" font-size="11" fill="#1a1810">SOUND CONSOLE — LOWER SHELF RACK 3</text>
