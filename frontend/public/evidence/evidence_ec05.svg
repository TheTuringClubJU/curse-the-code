<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
    <defs>
        <radialGradient id="paperV" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#e8ede8"/><stop offset="100%" stop-color="#b8ccb8"/></radialGradient>
    </defs>
    <rect width="580" height="440" fill="url(#paperV)" rx="5"/>
    <rect width="564" height="424" x="8" y="8" fill="none" stroke="#3a5a3a" stroke-width="1.5" opacity="0.4" rx="4"/>

    <!-- Header -->
    <text x="60" y="52" font-family="Courier, monospace" font-size="13" font-weight="bold" letter-spacing="2" fill="#1a3a1a">AUTOMATED RADIO INTERCEPT — DELTA RECEIVE</text>
    <text x="60" y="70" font-family="Courier, monospace" font-size="10" letter-spacing="1" fill="#3a5a3a">RADIO INTERCEPT DIVISION // TELETYPE OUTPUT</text>
    <line x1="60" y1="85" x2="520" y2="85" stroke="#3a5a3a" stroke-width="1.2" opacity="0.5"/>

    <!-- Data Fields -->
    <text x="60" y="120" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#3a5a3a">FREQUENCY:</text>
    <text x="210" y="120" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#1a3a1a">7.455 MHz</text>
    <text x="60" y="145" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#3a5a3a">DATE / TIME:</text>
    <text x="210" y="145" font-family="Courier, monospace" font-size="12" fill="#1a3a1a">14 AUG 1983  |  23:58 hrs</text>
    <text x="60" y="170" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#3a5a3a">DIRECTION:</text>
    <text x="210" y="170" font-family="Courier, monospace" font-size="12" fill="#1a3a1a">INBOUND</text>
    <text x="60" y="195" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#3a5a3a">SENDER:</text>
    <text x="210" y="195" font-family="Courier, monospace" font-size="12" fill="#1a3a1a">UNIDENTIFIED</text>

    <!-- Decoded Box -->
    <rect x="60" y="225" width="460" height="90" fill="#1a3a1a" opacity="0.08" rx="4"/>
    <text x="80" y="250" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#2a5a2a">DECODED CONTENT:</text>
    <text x="80" y="275" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#a31818">"Echo Zero authorised. Lock it down. Do not enter."</text>
    <text x="80" y="298" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#a31818">"If it speaks, do not respond."</text>

    <!-- Stamp -->
    <g transform="translate(370, 48) rotate(10)">
        <rect x="0" y="0" width="145" height="38" fill="none" stroke="#a31818" stroke-width="2" stroke-dasharray="4 2" rx="3" opacity="0.85"/>
        <text x="72" y="24" font-family="Courier, monospace" font-size="10" font-weight="900" fill="#a31818" text-anchor="middle" letter-spacing="1">ECHO ZERO ACTIVE</text>
    </g>

    <!-- Footer -->
    <line x1="60" y1="385" x2="520" y2="385" stroke="#3a5a3a" stroke-width="0.8" opacity="0.4"/>
    <text x="60" y="405" font-family="Courier, monospace" font-size="10" fill="#3a5a3a">RECORD ID: EC05 — RADIO INTERCEPT PRINTOUT</text>
    <text x="520" y="405" font-family="Courier, monospace" font-size="9" fill="#5a7a5a" text-anchor="end">SUBSTATION DELTA // CTRL-05</text>
</svg>