<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
    <defs>
        <radialGradient id="paperV" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#f5f0e5"/><stop offset="100%" stop-color="#d0c8b0"/></radialGradient>
    </defs>
    <rect width="580" height="440" fill="url(#paperV)" rx="5"/>
    <rect width="564" height="424" x="8" y="8" fill="none" stroke="#7a6a4a" stroke-width="1.5" opacity="0.4" rx="4"/>

    <!-- Header -->
    <text x="60" y="52" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#5a4a30">[Handwritten on a folded piece of notepaper]</text>
    <line x1="60" y1="64" x2="520" y2="64" stroke="#7a6a4a" stroke-width="1" opacity="0.4"/>

    <!-- Handwritten lines -->
    <text x="60" y="110" font-family="Georgia, serif" font-size="15" fill="#1a1206">"Monitor 6 is showing again."</text>
    <text x="60" y="145" font-family="Georgia, serif" font-size="14" fill="#1a1206">"Same figure in the east corridor. Same posture. Same place."</text>
    <text x="60" y="180" font-family="Georgia, serif" font-size="14" fill="#1a1206">"I ran the tape back. It's not on any recording."</text>
    <text x="60" y="215" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#a31818">"It's only live."</text>
    <text x="60" y="255" font-family="Georgia, serif" font-size="14" fill="#1a1206">"I'm not logging this. I want to go home."</text>

    <!-- Signoff -->
    <text x="420" y="320" font-family="Georgia, serif" font-size="13" fill="#5a4a30" font-style="italic">— [no signature]</text>

    <!-- Footer -->
    <line x1="60" y1="385" x2="520" y2="385" stroke="#7a6a4a" stroke-width="0.8" opacity="0.4"/>
    <text x="60" y="405" font-family="Courier, monospace" font-size="10" fill="#7a6a4a">RECORD ID: EC04 — OPERATOR FOLDED NOTEPAPER</text>
    <text x="520" y="405" font-family="Courier, monospace" font-size="9" fill="#9a8a6a" text-anchor="end">SUBSTATION DELTA // CTRL-05</text>
</svg>