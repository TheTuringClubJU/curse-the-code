<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" width="100%" height="100%">
    <defs>
        <radialGradient id="paperV" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#f0ebe0"/><stop offset="100%" stop-color="#c8bfaa"/></radialGradient>
    </defs>
    <rect width="580" height="440" fill="url(#paperV)" rx="5"/>
    <rect width="564" height="424" x="8" y="8" fill="none" stroke="#8a3a2a" stroke-width="1.5" opacity="0.4" rx="4"/>

    <!-- Warning triangle -->
    <polygon points="290,40 235,130 345,130" fill="none" stroke="#a31818" stroke-width="3" opacity="0.8"/>
    <text x="290" y="115" font-family="Courier, monospace" font-size="22" font-weight="bold" fill="#a31818" text-anchor="middle">!</text>

    <!-- Header -->
    <text x="60" y="160" font-family="Courier, monospace" font-size="12" font-style="italic" fill="#8a3a2a">[Handwritten note taped inside fuse box door]</text>
    <line x1="60" y1="172" x2="520" y2="172" stroke="#8a3a2a" stroke-width="1.2" opacity="0.5"/>

    <!-- Note lines -->
    <text x="60" y="200" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#a31818">FUSES 4, 7, 9 — DO NOT RESTORE TO OFF</text>
    <text x="60" y="225" font-family="Courier, monospace" font-size="12" fill="#2b1510">These circuits feed Chamber 3.</text>
    <text x="60" y="248" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#2b1510">They are meant to be on.</text>
    <text x="60" y="271" font-family="Courier, monospace" font-size="12" fill="#2b1510">Anyone who switches them off will answer to me.</text>
    <text x="60" y="294" font-family="Courier, monospace" font-size="12" fill="#2b1510">If the system looks broken, it isn't.</text>
    <text x="60" y="317" font-family="Courier, monospace" font-size="13" font-weight="bold" fill="#a31818">Leave it.</text>

    <!-- Signoff -->
    <text x="420" y="340" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#2b1510">— M.C.</text>

    <!-- Footer -->
    <line x1="60" y1="385" x2="520" y2="385" stroke="#8a3a2a" stroke-width="0.8" opacity="0.4"/>
    <text x="60" y="405" font-family="Courier, monospace" font-size="10" fill="#8a3a2a">RECORD ID: EC08 — FUSE BOX OVERRIDE NOTE</text>
    <text x="520" y="405" font-family="Courier, monospace" font-size="9" fill="#aa5a4a" text-anchor="end">SUBSTATION DELTA // CTRL-05</text>
</svg>